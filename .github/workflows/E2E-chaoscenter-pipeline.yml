name: ChaosCenter E2E testing

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  run-litmus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add litmus Chaos Repository
        run: |
          helm repo add litmuschaos https://litmuschaos.github.io/litmus-helm/
          helm repo update

      - name: Start minikube
        run: minikube start

      - name: Create litmus namespace
        run: kubectl create ns litmus

      - name: Install Litmus
        run: |
          helm install chaos litmuschaos/litmus \
            --namespace=litmus \
            --set portal.frontend.service.type=NodePort -f ./litmus/values-ci.yaml

      - name: Wait for ChaosCenter to be ready
        run: |
          # fail when the control plane does not come up instead of waiting forever
          kubectl wait --for=condition=Available deployment --all -n litmus --timeout=600s
          kubectl rollout status statefulset --all -n litmus --timeout=600s
          kubectl get pods -n litmus

      - name: Extract Minikube IP and NodePort
        run: |
          MINIKUBE_IP=$(minikube ip)
          NODE_PORT=$(kubectl get svc chaos-litmus-frontend-service -n litmus -o jsonpath='{.spec.ports[0].nodePort}')
          echo "MINIKUBE_IP=$MINIKUBE_IP" >> $GITHUB_ENV
          echo "NODE_PORT=$NODE_PORT" >> $GITHUB_ENV

      # The cypress run fails this step when a test fails. Do not use the `start` input for the
      # tests, a command started that way runs in the background and its exit code is ignored.
      - name: Cypress run with env
        uses: cypress-io/github-action@v6
        with:
          working-directory: chaoscenter
          wait-on: http://${{ env.MINIKUBE_IP }}:${{ env.NODE_PORT }}
          wait-on-timeout: 120
        env:
          CYPRESS_baseUrl: http://${{ env.MINIKUBE_IP }}:${{ env.NODE_PORT }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaoscenter-e2e-junit
          path: chaoscenter/results/*.xml
          if-no-files-found: warn

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaoscenter-e2e-screenshots
          path: chaoscenter/cypress/screenshots
          if-no-files-found: ignore

      - name: "[Debug]: ChaosCenter state"
        if: failure()
        continue-on-error: true
        run: |
          kubectl get pods -n litmus
          kubectl describe pods -n litmus | tail -n 200
