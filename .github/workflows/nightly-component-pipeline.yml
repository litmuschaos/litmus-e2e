      - name: TCID-K3S-GENERIC-ENGINE-APP-INFO
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make appinfo

      - name: TCID-K3S-GENERIC-ENGINE-ANNOTATION-CHECK
