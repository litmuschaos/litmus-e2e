---
name: Nightly-Node-Level-Pipeline
on:
  schedule:
    - cron: "30 20 * * *" # Daily 02:30 AM in midnight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Node_Level_Test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CHAOS_NAMESPACE: "litmus"
      APP_NS: "litmus"
      NODE_LEVEL: "true"
      KUBECONFIG: /home/runner/.kube/config
      JUNIT_REPORT_DIR: ${{ github.workspace }}/results/bdd

    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - uses: actions/checkout@v4

      # a multi node cluster, the self hosted runners used earlier for this pipeline do not exist anymore
      - name: Installing Prerequisites (Kubernetes Cluster)
        id: cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: litmus-e2e
          config: .github/kind/node-level.yaml
          wait: 180s

      - name: Litmus Infra Setup
        id: litmus
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: make build-litmus

      - name: Deploy App
        id: app
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: make app-deploy

      - name: TCID-KIND-GENERIC-INFRA-POD-AUTOSCALER
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make pod-autoscaler

      - name: TCID-KIND-GENERIC-INFRA-NODE-CPU-HOG
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make node-cpu-hog

      - name: TCID-KIND-GENERIC-INFRA-NODE-MEMORY-HOG
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make node-memory-hog

      - name: TCID-KIND-GENERIC-INFRA-NODE-DRAIN
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make node-drain

      - name: TCID-KIND-GENERIC-INFRA-KUBELET-SERVICE-KILL
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make kubelet-service-kill

      - name: TCID-KIND-GENERIC-INFRA-NODE-TAINT
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make node-taint

      - name: TCID-KIND-GENERIC-INFRA-NODE-IO-STRESS
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make node-io-stress

      - name: TCID-KIND-GENERIC-INFRA-NODE-SELECTOR
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make node-selector

      - name: TCID-KIND-GENERIC-INFRA-WITH-APP-INFO
        if: ${{ !cancelled() && steps.litmus.outcome == 'success' && steps.app.outcome == 'success' }}
        run: make with-app-info

      - name: "[Debug]: check chaos resources"
        if: ${{ failure() }}
        continue-on-error: true
        run: bash build/debug.sh

      - name: "[Debug]: check operator logs"
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          operator_name=$(kubectl get pods -n litmus -l app.kubernetes.io/component=operator --no-headers | awk '{print$1}')
          kubectl logs $operator_name -n litmus > logs.txt
          cat logs.txt

      - name: Application Cleanup
        if: ${{ always() && steps.cluster.outcome == 'success' }}
        run: make app-cleanup

      - name: Litmus Cleanup
        if: ${{ always() && steps.cluster.outcome == 'success' }}
        run: make litmus-cleanup

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-junit-${{ github.job }}
          path: results/bdd/*.xml
          if-no-files-found: ignore
